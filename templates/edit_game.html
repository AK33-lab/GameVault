<!DOCTYPE html>
<html>
<head><title>Edit Game</title></head>
<body>
    <h1>Edit Game</h1>
    <form method="POST">
        <label>Title: <input type="text" name="title" value="{{ game['title'] }}" required></label><br><br>
        <label>Console:
            <select name="console_id">
                {% for console in consoles %}
                <option value="{{ console['id'] }}" 
                    {% if console['id'] == game['console_id'] %}selected{% endif %}>
                    {{ console['name'] }}
                </option>
                {% endfor %}
            </select>
        </label><br><br>
        <label>Genre:
            <select name="genre_id">
                {% for genre in genres %}
                <option value="{{ genre['id'] }}"
                    {% if genre['id'] == game['genre_id'] %}selected{% endif %}>
                    {{ genre['name'] }}
                </option>
                {% endfor %}
            </select>
        </label><br><br>
        <label>Publisher: <input type="text" name="publisher" value="{{ game['publisher'] or '' }}"></label><br><br>
        <label>Developer: <input type="text" name="developer" value="{{ game['developer'] or '' }}"></label><br><br>
        <label>Critic Score: <input type="number" step="0.1" name="critic_score" value="{{ game['critic_score'] or '' }}"></label><br><br>
        <label>Total Sales (mil): <input type="number" step="0.01" name="total_sales" value="{{ game['total_sales'] or '' }}"></label><br><br>
        <label>NA Sales (mil): <input type="number" step="0.01" name="na_sales" value="{{ game['na_sales'] or '' }}"></label><br><br>
        <label>JP Sales (mil): <input type="number" step="0.01" name="jp_sales" value="{{ game['jp_sales'] or '' }}"></label><br><br>
        <button type="submit">Save Changes</button>
        <a href="/">Cancel</a>
    </form>
</body>
</html>
