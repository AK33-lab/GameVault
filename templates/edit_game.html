{% extends 'base.html' %}
{% block title %}Edit Game{% endblock %}
{% block content %}
<div class="page-title">// edit game</div>

<form method="POST">
    <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" value="{{ game['title'] }}" required>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>Console</label>
            <select name="console_id">
                {% for console in consoles %}
                <option value="{{ console['id'] }}" {% if console['id'] == game['console_id'] %}selected{% endif %}>
                    {{ console['name'] }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Genre</label>
            <select name="genre_id">
                {% for genre in genres %}
                <option value="{{ genre['id'] }}" {% if genre['id'] == game['genre_id'] %}selected{% endif %}>
                    {{ genre['name'] }}
                </option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>Publisher</label>
            <input type="text" name="publisher" value="{{ game['publisher'] or '' }}">
        </div>
        <div class="form-group">
            <label>Developer</label>
            <input type="text" name="developer" value="{{ game['developer'] or '' }}">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>Critic Score (0-10)</label>
            <input type="number" step="0.1" min="0" max="10" name="critic_score" value="{{ game['critic_score'] or '' }}">
        </div>
        <div class="form-group">
            <label>Total Sales (mil)</label>
            <input type="number" step="0.01" name="total_sales" value="{{ game['total_sales'] or '' }}">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>NA Sales (mil)</label>
            <input type="number" step="0.01" name="na_sales" value="{{ game['na_sales'] or '' }}">
        </div>
        <div class="form-group">
            <label>JP Sales (mil)</label>
            <input type="number" step="0.01" name="jp_sales" value="{{ game['jp_sales'] or '' }}">
        </div>
    </div>
    <div style="display: flex; gap: 12px; margin-top: 8px;">
        <button type="submit" class="btn btn-primary">SAVE CHANGES</button>
        <a href="/" class="btn btn-outline">CANCEL</a>
    </div>
</form>
{% endblock %}
