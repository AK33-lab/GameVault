<!DOCTYPE html>
<html>
<head><title>Add Game</title></head>
<body>
    <h1>Add New Game</h1>
    <form method="POST">
        <label>Title: <input type="text" name="title" required></label><br><br>
        <label>Console:
            <select name="console_id">
                {% for console in consoles %}
                <option value="{{ console['id'] }}">{{ console['name'] }}</option>
                {% endfor %}
            </select>
        </label><br><br>
        <label>Genre:
            <select name="genre_id">
                {% for genre in genres %}
                <option value="{{ genre['id'] }}">{{ genre['name'] }}</option>
                {% endfor %}
            </select>
        </label><br><br>
        <label>Publisher: <input type="text" name="publisher"></label><br><br>
        <label>Developer: <input type="text" name="developer"></label><br><br>
        <label>Critic Score: <input type="number" step="0.1" name="critic_score"></label><br><br>
        <label>Total Sales (mil): <input type="number" step="0.01" name="total_sales"></label><br><br>
        <label>NA Sales (mil): <input type="number" step="0.01" name="na_sales"></label><br><br>
        <label>JP Sales (mil): <input type="number" step="0.01" name="jp_sales"></label><br><br>
        <button type="submit">Add Game</button>
        <a href="/">Cancel</a>
    </form>
</body>
</html>
